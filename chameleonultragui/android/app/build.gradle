plugins {
    id "com.android.application"
    // The Flutter Gradle Plugin supplies transitional Kotlin support on AGP 8.
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "io.chameleon.ultra"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = "28.2.13676358"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId = "io.chameleon.ultra"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
       release {
           keyAlias keystoreProperties['keyAlias']
           keyPassword keystoreProperties['keyPassword']
           storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
           storePassword keystoreProperties['storePassword']
       }
    }

    buildTypes {
        release {
            if (keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']).exists() : false) {
                println "Info: upload-keystore.jks found. Signing for release."
                signingConfig = signingConfigs.release
            }
            else {
                println "Warning: upload-keystore.jks not found. Release mode will use the debug signing certificate."
                signingConfig = signingConfigs.debug
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "../../src/CMakeLists.txt"
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

flutter {
    source = "../.."
}

dependencies {
    implementation "com.polidea.rxandroidble2:rxandroidble:1.17.2"
    testImplementation "junit:junit:4.13.2"
}
